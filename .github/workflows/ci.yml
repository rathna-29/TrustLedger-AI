name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/base.txt.orig
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
      - name: Seed database
        run: python database/seed_data.py
      - name: Smoke - boot + endpoints
        run: |
          python app.py & APP_PID=$!
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:5000/healthz && break
            sleep 0.5
          done
          curl -fsS -o /dev/null -w "dashboard=%{http_code}\n" http://127.0.0.1:5000/dashboard
          curl -fsS -o /dev/null -w "overview=%{http_code}\n" http://127.0.0.1:5000/api/overview
          kill $APP_PID
      - name: Tests
        run: python -m unittest discover -s tests -v
